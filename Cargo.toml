# Cargo workspace for the Erno monorepo.
#
# `api/` (the erno library) and `cli/` (the erno binary) share most of their
# dependencies. Before this workspace existed
# each crate declared its own versions and they had already drifted — cli was
# pulling in native-TLS while the other two were rustls-only, and serde/tokio
# were pinned in two crates and floating in the third. `[workspace.dependencies]`
# is the fix: one version per crate, with members adding whatever extra features
# they need.
#
# `cli/templates/` is excluded because it holds scaffold templates whose
# Cargo.toml carries `{{name}}` placeholders and is not valid to cargo.
[workspace]
members  = ["api", "cli", "error-reporting-types"]
exclude  = ["cli/templates", "target"]
resolver = "2"

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.88.0"

[workspace.dependencies]
# The error-reporting contract. The reporter here and the collector in the
# erno-monitoring repository are deployed separately and must agree on these
# shapes, so neither owns them.
erno-error-reporting-types = { path = "error-reporting-types" }
# Shared by all three crates.
reqwest    = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde      = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
tokio      = { version = "1.47.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# Shared by two.
argon2            = "0.5"
async-trait       = "0.1"
axum              = "0.8.4"
axum-test         = "18.5"
base64            = "0.22"
chrono            = { version = "0.4", features = ["serde"] }
clap              = { version = "4.5", features = ["derive"] }
config_rs         = { package = "config", git = "https://github.com/rust-cli/config-rs.git", tag = "v0.15.13" }
rand              = "0.8"
sea-orm           = { version = "1.1.0", features = ["sqlx-postgres", "runtime-tokio", "macros", "with-uuid", "with-time"] }
sea-orm-migration = { version = "1.1.14", features = ["sqlx-postgres"] }
toml              = "0.8"
serde_yaml        = "0.9"
tracing           = "0.1.41"
uuid              = { version = "1.12", features = ["v4", "serde"] }

# OpenTelemetry — one set of versions so api/cli/monitoring cannot drift.
# tracing-opentelemetry 0.32 tracks opentelemetry 0.31 (the versions are not
# aligned). HTTP/protobuf only: no tonic, and reqwest 0.12 matches the workspace.
opentelemetry                      = "0.31"
opentelemetry_sdk                  = { version = "0.31", default-features = false, features = ["trace", "logs"] }
# `reqwest-blocking-client`, not `reqwest-client`: the SDK exports on its own
# `OpenTelemetry.*.BatchProcessor` OS threads, which have no tokio reactor, and
# the async client panics there the moment it tries to send a batch.
opentelemetry-otlp                 = { version = "0.31", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace", "logs"] }
opentelemetry-semantic-conventions = "0.31"
tracing-opentelemetry              = "0.32"
opentelemetry-appender-tracing     = "0.31"
