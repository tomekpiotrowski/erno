# Cargo workspace for the Erno monorepo.
#
# `api/` (the erno library), `cli/` (the erno binary) and `monitoring/` (the
# collector) share 18 dependencies between them. Before this workspace existed
# each crate declared its own versions and they had already drifted — cli was
# pulling in native-TLS while the other two were rustls-only, and serde/tokio
# were pinned in two crates and floating in the third. `[workspace.dependencies]`
# is the fix: one version per crate, with members adding whatever extra features
# they need.
#
# `cli/templates/` is excluded because it holds scaffold templates whose
# Cargo.toml carries `{{name}}` placeholders and is not valid to cargo.
[workspace]
members  = ["api", "cli", "monitoring"]
exclude  = ["cli/templates", "target"]
resolver = "2"

[workspace.package]
edition      = "2021"
rust-version = "1.88.0"

[workspace.dependencies]
# Shared by all three crates.
reqwest    = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde      = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
tokio      = { version = "1.47.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# Shared by two.
argon2            = "0.5"
async-trait       = "0.1"
axum              = "0.8.4"
axum-test         = "18.5"
base64            = "0.22"
chrono            = { version = "0.4", features = ["serde"] }
clap              = { version = "4.5", features = ["derive"] }
config_rs         = { package = "config", git = "https://github.com/rust-cli/config-rs.git", tag = "v0.15.13" }
rand              = "0.8"
sea-orm           = { version = "1.1.0", features = ["sqlx-postgres", "runtime-tokio", "macros", "with-uuid", "with-time"] }
sea-orm-migration = { version = "1.1.14", features = ["sqlx-postgres"] }
toml              = "0.8"
tracing           = "0.1.41"
uuid              = { version = "1.12", features = ["v4", "serde"] }
