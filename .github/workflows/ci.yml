name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# This mirrors ./build.sh, which is the entry point developers actually use.
# Keep the two in step: a check that only exists here is a check nobody can
# reproduce locally.
#
# Linux and stable only, deliberately. The test suites need a real PostgreSQL
# and the crates are built to be deployed to Linux containers, so a
# Windows/macOS matrix tested a configuration nothing ships.
jobs:
  check:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erno
          POSTGRES_PASSWORD: erno
          POSTGRES_DB: erno
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The collector has its own database; see monitoring/config/test.toml.
      - name: Create the collector's test database
        run: PGPASSWORD=erno createdb -h localhost -U erno erno_monitoring_test

      - name: Test api
        run: cargo test -p erno --all-features

      - name: Test cli
        run: cargo test -p erno-cli

      # Deliberately `cd`s rather than using `-p`: monitoring/.cargo/config.toml
      # sets RUST_TEST_THREADS=1, and cargo finds that by walking up from the
      # working directory. The suite deadlocks against itself in parallel.
      - name: Test monitoring
        run: cargo test
        working-directory: monitoring

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check documentation
        run: cargo doc -p erno --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
