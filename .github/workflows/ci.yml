name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  BUN_FEATURE_FLAG_DISABLE_STREAMING_INSTALL: "1"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# This mirrors ./build.sh, which is the entry point developers actually use.
# Keep the two in step: a check that only exists here is a check nobody can
# reproduce locally.
#
# Linux and stable only, deliberately. The test suites need a real PostgreSQL
# and the crates are built to be deployed to Linux containers, so a
# Windows/macOS matrix tested a configuration nothing ships.
jobs:
  check:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erno
          POSTGRES_PASSWORD: erno
          POSTGRES_DB: erno
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test error-reporting-types
        run: cargo test -p erno-error-reporting-types

      - name: Test api
        run: cargo test -p erno --all-features

      - name: Test cli
        run: cargo test -p erno-cli

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check documentation
        run: cargo doc -p erno --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  app:
    name: erno-angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install
        run: bun install --frozen-lockfile
        working-directory: app
      - name: Build
        run: bun run build erno-angular
        working-directory: app
      - name: Test
        run: bun run test
        working-directory: app

  admin:
    name: Admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install
        run: bun install --frozen-lockfile
        working-directory: admin
      - name: Build
        run: bun run build
        working-directory: admin
