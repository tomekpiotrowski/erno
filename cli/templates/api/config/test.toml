api_url = "http://localhost:3001"

[tracing]
log_level = "warn"

[database]
url = "postgres://{{db_name}}:{{db_password}}@localhost/{{db_name}}_test"
# Live `APP_ENVIRONMENT=test` boots workers + scheduler; 2 is too small.
pool_size = 10

[server]
port = 3001

[email]
type = "mock"

[auth]
secret = "test_jwt_secret_for_testing_only_1234567890"
access_token_minutes = 15
one_time_token_expiry_hours = 24
refresh_token_days = 30

[jobs.cleanup]
interval_seconds = 3600
completed_retention_seconds = 7200
failed_retention_seconds = 172800
batch_size = 1000

[jobs.workers.default]
jobs = ["send_verification_email", "send_password_reset_email", "send_already_registered_email", "cancel_stripe_subscription", "delete_stripe_customer", "delete_user_files", "delete_record_attachments"]
count = 1
job_timeout = 300
max_retries = 4
base_retry_delay_seconds = 60
retry_backoff_multiplier = 5

[rate_limiting]
enabled = false
default_window_secs = 60
default_max_requests = 1000
backoff_multiplier = 2.0

# Operator admin API — password: admin
[admin]
username = "admin"
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$5B2ECOLqakkxkiD5EjKyDQ$PBe29N0j5lou/OHFWQuxjKEnL7fv4GE9MhniBui9rYc"
