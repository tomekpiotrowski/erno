# Written by `erno dev` under `.erno/tempo/`. `__DATA__` is replaced with that
# directory. Query is :3200; OTLP/HTTP ingest is :4318.
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3200
  log_level: error

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 127.0.0.1:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 1h

storage:
  trace:
    backend: local
    wal:
      path: __DATA__/wal
    local:
      path: __DATA__/blocks
