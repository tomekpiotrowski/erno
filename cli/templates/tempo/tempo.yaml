# Written by `erno dev` under `.erno/tempo/`. `__DATA__` is replaced with that
# directory. Query is :3200; OTLP/HTTP ingest is :4318; gRPC is :9095.
#
# Tempo 3.0 removed `ingester` and `compactor`. Live-store holds recent traces;
# the backend scheduler owns compaction/retention. Paths that default to
# `/var/tempo` are pointed at this directory so a user-owned `erno dev` can start.
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3200
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9095
  log_level: error

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 127.0.0.1:4318

live_store:
  max_block_duration: 5m
  wal:
    path: __DATA__/live-store/traces
  shutdown_marker_dir: __DATA__/live-store/shutdown-marker

backend_scheduler:
  local_work_path: __DATA__/work
  provider:
    compaction:
      compaction:
        block_retention: 1h

storage:
  trace:
    backend: local
    wal:
      path: __DATA__/wal
    local:
      path: __DATA__/blocks
