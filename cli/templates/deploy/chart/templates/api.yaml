apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
    spec:
      # Kubernetes removes the pod from the Service and sends SIGTERM at the
      # same moment, so without this pause the ingress can still route to a
      # process that has already stopped accepting. Graceful shutdown without
      # a preStop delay increases 502s rather than removing them.
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: {{ .Release.Name }}-registry
      containers:
        - name: api
          image: "ghcr.io/{{github_repo}}/api:{{ .Values.api.imageTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            {{- include "{{name}}.apiEnv" . | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
