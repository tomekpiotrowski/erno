registry:
  server: ghcr.io
  username: ""
  password: ""

api:
  imageTag: ""
  database_url: "postgres://user:pass@host:5432/dbname"
  jwt_secret: ""
  api_url: "https://api.example.com"
  # Argon2 hash only — generated by `erno deploy init`. Never put the plaintext password here.
  admin_password_hash: "{{admin_password_hash}}"
  # Optional Bearer token for /metrics scrapes. Must match Prometheus scrape config.
  metrics_auth_token: ""
  smtp_host: ""
  smtp_port: 587
  smtp_username: ""
  smtp_password: ""
  smtp_from: ""
  log_level: "info"
  # Where this API sends its errors and subsystem health — the monitoring
  # deployment, which lives in a different cluster.
  error_reporting:
    collector_url: "https://monitoring.example.com"
    # MUST equal collector.server_token in
    # monitoring/deploy/chart/secrets.<env>.yaml. If the two differ, every
    # report is rejected with a 401 and nothing says so.
    # Generated for you by `erno deploy init --target monitoring`.
    ingest_token: ""

app:
  imageTag: ""
  api_url: "https://api.example.com"

www:
  imageTag: ""
  # Product app origin — used for Sign in / Get started links on the landing page.
  app_url: "https://app.example.com"

ingress:
  api:
    host: api.example.com
  app:
    host: app.example.com
  www:
    host: example.com
  admin:
    host: admin.example.com
  tls: true
  issuer: letsencrypt
  email: ""
