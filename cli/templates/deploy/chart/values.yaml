image:
  pullPolicy: IfNotPresent

api:
  replicas: 1
  port: 3000

app:
  replicas: 1

www:
  replicas: 1

admin:
  enabled: true
  replicas: 1
  imageTag: ""

# Prometheus is no longer part of this chart. It belongs to the monitoring
# deployment (monitoring/deploy/chart), which runs on separate infrastructure so
# it survives the outages it exists to report. Point it at this application's
# /metrics and set `api.metrics_auth_token` there and here to the same value.
