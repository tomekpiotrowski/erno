# Copy to secrets.production.yaml, fill in, then encrypt:
#
#     sops -e -i deploy/secrets.production.yaml
#
# Image tags come from `erno deploy install <version>`, hosts from config.toml.
# This file is secrets and registry pull credentials only.

registry:
  server: ghcr.io
  username: ""
  password: ""

api:
  database_url: "postgres://user:pass@host:5432/dbname"
  jwt_secret: ""
  # Argon2 hash only — generated by `erno deploy init`. Never put the plaintext password here.
  admin_password_hash: "{{admin_password_hash}}"
  # Optional Bearer token for /metrics scrapes. Must match the monitoring scrape token.
  metrics_auth_token: ""
  smtp_host: ""
  smtp_port: 587
  smtp_username: ""
  smtp_password: ""
  smtp_from: ""
  log_level: "info"
  # MUST equal this app's project server token on the collector, which the
  # collector mints per project rather than reading from its own config.
  # If the two differ, every report is rejected with a 401 and nothing says so.
  # Fill it with `erno monitoring add --url <collector>`, which registers this
  # application and writes the token it is issued here.
  ingest_token: ""
