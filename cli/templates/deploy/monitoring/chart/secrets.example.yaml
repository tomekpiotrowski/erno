# Copy to secrets.production.yaml, fill in, then encrypt:
#
#     sops -e -i monitoring/deploy/chart/secrets.production.yaml
#
# Image tags and ingress hosts live ONLY here, never in values.yaml, so the
# chart cannot render without a secrets file.

registry:
  server: ghcr.io
  username: ""
  password: ""

collector:
  imageTag: ""
  database_url: "postgres://user:pass@host:5432/monitoring"
  # Unused for operator auth — the collector deliberately does not depend on the
  # application's auth service, which may be the thing that is down. Still
  # validated at boot, so it must be present and long.
  jwt_secret: "CHANGE_ME_run_erno_generate-jwt-secret"
  api_url: "https://monitoring.example.com"
  admin_username: "admin"
  # Generated by `erno deploy init --target monitoring`.
  admin_password_hash: ""
  # TRUSTED server-to-server token. MUST equal the application chart's
  # api.error_reporting.ingest_token — if these differ, the API's reports are
  # rejected with a 401 and the platform is silently dark.
  server_token: ""
  # PUBLIC. Ships inside the browser bundle, so treat it as a speed bump against
  # drive-by scanners, not as a security control. Safe to rotate independently.
  browser_token: ""
  # Guards the collector's own /metrics, which Prometheus scrapes in-cluster.
  metrics_auth_token: ""
  alerts_recipient: "ops@example.com"
  status_name: "Example status"
  log_level: "info"
  smtp_host: ""
  smtp_port: 587
  smtp_username: ""
  smtp_password: ""
  smtp_from: ""

console:
  imageTag: ""

# The application being watched, scraped across the network.
api:
  target: "api.example.com:443"
  scheme: https
  # MUST equal the application chart's api.metrics_auth_token.
  metrics_auth_token: ""

ingress:
  monitoring:
    host: monitoring.example.com
  tls: true
  issuer: letsencrypt
  email: ""
