# Values for the monitoring deployment.
#
# Docs: docs/src/content/docs/monitoring/metrics.md
#
# Deployed separately from the application — ideally to different
# infrastructure, since a monitoring stack that shares a failure domain with
# what it monitors is not monitoring.

# The application being watched. Reachable over the network, not in-cluster.
api:
  # host:port Prometheus should scrape.
  target: "api.example.com:443"
  scheme: https
  # Required in practice: an internet-reachable /metrics should not be open.
  # Set from a secret, not here.
  metrics_auth_token: ""

image:
  pullPolicy: IfNotPresent

collector:
  port: 3001
  replicas: 1
  # The collector's own /metrics, scraped in-cluster.
  metrics_auth_token: ""
  # Everything below comes from secrets.<env>.yaml. Listed here so the
  # templates have keys to read, and so `helm template` fails loudly on a
  # missing secrets file rather than rendering a half-configured deployment.
  imageTag: ""
  database_url: ""
  jwt_secret: ""
  api_url: ""
  admin_username: "admin"
  admin_password_hash: ""
  server_token: ""
  browser_token: ""
  alerts_recipient: ""
  status_enabled: true
  status_name: ""
  log_level: "info"
  smtp_host: ""
  smtp_port: 587
  smtp_username: ""
  smtp_password: ""
  smtp_from: ""

console:
  replicas: 1
  imageTag: ""

# Hosts live only in secrets.<env>.yaml, matching the application chart.
ingress:
  tls: true
  issuer: letsencrypt
  email: ""
  rateLimitRps: 20
  monitoring:
    host: ""

registry:
  server: ghcr.io
  username: ""
  password: ""

prometheus:
  enabled: true
  image: prom/prometheus:v2.55.1
  retention: 90d
  storage: 10Gi
