{{/*
  The collector: ingest, fingerprinting, issues, uptime, alerts, status.

  The Service name is load-bearing — templates/prometheus.yaml's scrape config
  hardcodes `{{ .Release.Name }}-collector` on `.Values.collector.port`, so the
  two must not drift.

  Stateless (Postgres is external), so RollingUpdate is correct here, unlike
  Prometheus which owns a ReadWriteOnce volume.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-collector
spec:
  replicas: {{ .Values.collector.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-collector
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-collector
    spec:
      # The collector holds Postgres advisory locks for its singleton loops
      # (uptime, status, alerting, retention). Giving it time to exit lets the
      # session close so another replica can take over promptly.
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: {{ .Release.Name }}-registry
      containers:
        - name: collector
          image: "ghcr.io/{{github_repo}}/monitoring:{{ .Values.collector.imageTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.collector.port }}
          env:
            {{- include "erno-monitoring.collectorEnv" . | nindent 12 }}
          volumeMounts:
            # The status publisher writes a snapshot on an interval. Mounted so
            # it does not need a writable image layer. Note this makes the
            # preview local to one pod — a status page that must survive this
            # deployment belongs in object storage behind a CDN.
            - name: status
              mountPath: /app/status
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          readinessProbe:
            httpGet:
              path: /readiness
              port: {{ .Values.collector.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /liveness
              port: {{ .Values.collector.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: status
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-collector
spec:
  selector:
    app: {{ .Release.Name }}-collector
  ports:
    - port: {{ .Values.collector.port }}
      targetPort: {{ .Values.collector.port }}
