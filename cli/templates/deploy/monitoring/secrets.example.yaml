# Copy to secrets.production.yaml, fill in, then encrypt:
#
#     sops -e -i deploy/secrets.production.yaml
#
# Image tags come from `erno deploy install <version> --target monitoring`.

registry:
  server: ghcr.io
  username: ""
  password: ""

collector:
  database_url: "postgres://user:pass@host:5432/monitoring"
  # Unused for operator auth — the collector deliberately does not depend on the
  # application's auth service, which may be the thing that is down. Still
  # validated at boot, so it must be present and long.
  jwt_secret: "CHANGE_ME_run_erno_generate-jwt-secret"
  admin_username: "admin"
  # Generated by `erno deploy init --target monitoring`.
  admin_password_hash: "{{admin_password_hash}}"
  # Guards the collector's own /metrics, which Prometheus scrapes in-cluster.
  metrics_auth_token: ""
  alerts_recipient: "ops@example.com"
  status_name: "Example status"
  log_level: "info"
  smtp_host: ""
  smtp_port: 587
  smtp_username: ""
  smtp_password: ""
  smtp_from: ""

# Seeds the first project. On an empty database the collector inserts a project
# named `monitoring` and hashes this value as its server ingest token, so the
# application whose api.ingest_token matches can report straight away.
#
# The chart injects both collector_url and ingest_token when this is set, which
# is also how this deployment self-reports. Leave both empty rather than setting
# a URL without a token — that would 401.
#
# Generated by `erno deploy init --target monitoring`, the same value written
# into the application's api.ingest_token.
error_reporting:
  ingest_token: "{{ingest_token}}"
