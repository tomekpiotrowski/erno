# Copy to secrets.production.yaml, fill in, then encrypt:
#
#     sops -e -i monitoring/deploy/secrets.production.yaml
#
# Image tags come from `erno deploy install <version> --target monitoring`.

registry:
  server: ghcr.io
  username: ""
  password: ""

collector:
  database_url: "postgres://user:pass@host:5432/monitoring"
  # Unused for operator auth — the collector deliberately does not depend on the
  # application's auth service, which may be the thing that is down. Still
  # validated at boot, so it must be present and long.
  jwt_secret: "CHANGE_ME_run_erno_generate-jwt-secret"
  admin_username: "admin"
  # Generated by `erno deploy init --target monitoring`.
  admin_password_hash: "{{admin_password_hash}}"
  # TRUSTED server-to-server token. MUST equal the application's api.ingest_token.
  # If these differ, the API's reports are rejected with a 401 and the platform
  # is silently dark.
  server_token: "{{ingest_token}}"
  # PUBLIC. Ships inside the browser bundle, so treat it as a speed bump against
  # drive-by scanners, not as a security control. Safe to rotate independently.
  browser_token: ""
  # Guards the collector's own /metrics, which Prometheus scrapes in-cluster.
  metrics_auth_token: ""
  alerts_recipient: "ops@example.com"
  status_name: "Example status"
  log_level: "info"
  smtp_host: ""
  smtp_port: 587
  smtp_username: ""
  smtp_password: ""
  smtp_from: ""

# The application being watched, scraped across the network.
api:
  # MUST equal the application's api.metrics_auth_token.
  metrics_auth_token: ""
