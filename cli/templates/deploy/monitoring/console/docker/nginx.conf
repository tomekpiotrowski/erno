server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Ungated here on purpose, because the collector authenticates everything
    # itself and the halves need different credentials: OTLP ingest under
    # /api/otlp takes a project's server bearer, POST /api/errors takes an
    # ingest token (the browser one is public by design), and everything under
    # /api/collector is behind the collector's own HTTP Basic layer. Putting
    # auth_request in front would break ingest — and would put this pod in the
    # failure domain of every application's telemetry.
    location /api/ {
        proxy_pass http://__COLLECTOR_HOST__:__COLLECTOR_PORT__/api/;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        # OTLP batches dwarf error envelopes; the collector enforces its own
        # tighter per-route limits behind this.
        client_max_body_size 8m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
