server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Used only to gate the Prometheus proxy below. Any operator-authenticated
    # collector endpoint works; issue counts is the cheapest.
    location = /__monitoring_auth {
        internal;
        proxy_pass http://__COLLECTOR_HOST__:__COLLECTOR_PORT__/api/collector/issues/counts;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    # Ungated here on purpose, because the collector authenticates this itself
    # and the two halves need different credentials: POST /api/errors takes an
    # ingest token (the browser one is public by design), while everything under
    # /api/collector is behind the collector's own HTTP Basic layer. Putting
    # auth_request in front would break ingest.
    location /api/ {
        proxy_pass http://__COLLECTOR_HOST__:__COLLECTOR_PORT__/api/;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        # Stack traces are not small, and ingest accepts batches.
        client_max_body_size 2m;
    }

    # Prometheus has no authentication of its own, so the collector's operator
    # credentials stand in for it.
    location /prometheus/ {
        auth_request /__monitoring_auth;
        proxy_pass http://__PROM_HOST__:9090/;
        proxy_set_header Authorization "";
    }

    # Reads, not ingest. The console names the project it is looking at and
    # this maps that onto the tenant header. Trusting the console here is fine
    # in a way trusting an application is not: these are already behind operator
    # Basic, and one operator sees every project by design.
    location /tempo/ {
        auth_request /__monitoring_auth;
        proxy_pass http://__TEMPO_HOST__:3200/;
        proxy_set_header Authorization "";
        proxy_set_header X-Scope-OrgID $http_x_erno_project;
    }

    location /loki/ {
        auth_request /__monitoring_auth;
        proxy_pass http://__LOKI_HOST__:3100/;
        proxy_set_header Authorization "";
        proxy_set_header X-Scope-OrgID $http_x_erno_project;
    }

    # OTLP ingest from application APIs. Tempo and Loki have no auth of their
    # own; the collector's trusted server token stands in.
    #
    # The auth response also names the tenant. nginx cannot rewrite a protobuf
    # body to stamp a project onto it, but Tempo and Loki already isolate on
    # X-Scope-OrgID, and that is a header — so the collector resolves it from
    # the token and this copies it onto the push. `proxy_hide_header` keeps it
    # off the response to the application, which has no business knowing it.
    location = /__otlp_auth {
        internal;
        proxy_pass http://__COLLECTOR_HOST__:__COLLECTOR_PORT__/api/otlp/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header X-Scope-OrgID;
    }

    location /otlp/v1/traces {
        auth_request /__otlp_auth;
        auth_request_set $erno_tenant $upstream_http_x_scope_orgid;
        proxy_pass http://__TEMPO_HOST__:4318/v1/traces;
        proxy_set_header Authorization "";
        # Overwritten, never forwarded: a caller that could choose its own
        # tenant could write into another application's traces.
        proxy_set_header X-Scope-OrgID $erno_tenant;
        client_max_body_size 4m;
    }

    location /otlp/v1/logs {
        auth_request /__otlp_auth;
        auth_request_set $erno_tenant $upstream_http_x_scope_orgid;
        proxy_pass http://__LOKI_HOST__:3100/otlp/v1/logs;
        proxy_set_header Authorization "";
        proxy_set_header X-Scope-OrgID $erno_tenant;
        client_max_body_size 4m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
