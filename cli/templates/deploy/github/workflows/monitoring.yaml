# The monitoring deployment builds and releases independently of the
# application. A single workflow would rebuild and republish the monitoring
# chart on every application tag, and the two have no reason to share a cadence.
name: Monitoring

on:
  push:
    tags: [ 'mon-v*' ]
  pull_request:
    paths: [ 'monitoring/**' ]

env:
  REGISTRY: ghcr.io

jobs:
  collector_test:
    name: Test collector
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erno
          POSTGRES_PASSWORD: erno
          POSTGRES_DB: erno
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: PGPASSWORD=erno createdb -h localhost -U erno erno_monitoring_test
      # `working-directory` rather than `-p`: monitoring/.cargo/config.toml sets
      # RUST_TEST_THREADS=1, which cargo finds by walking up from the working
      # directory. The suite deadlocks against itself in parallel.
      - run: cargo test
        working-directory: monitoring

  collector_docker:
    name: Build collector image
    runs-on: ubuntu-latest
    needs: collector_test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "version=${GITHUB_REF#refs/tags/mon-}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./monitoring
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/monitoring:${{ steps.meta.outputs.version }}

  console_docker:
    name: Build console image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "version=${GITHUB_REF#refs/tags/mon-}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./monitoring/ui
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/monitoring-ui:${{ steps.meta.outputs.version }}

  chart:
    name: Publish chart
    runs-on: ubuntu-latest
    needs: [ collector_docker, console_docker ]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - id: meta
        run: echo "version=${GITHUB_REF#refs/tags/mon-}" >> "$GITHUB_OUTPUT"
      - name: Package and push
        working-directory: ./monitoring/deploy/chart
        run: |
          helm package . --version "${{ steps.meta.outputs.version }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
          helm push ./*.tgz "oci://ghcr.io/${{ github.repository }}"
