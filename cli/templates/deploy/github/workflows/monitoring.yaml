# The collector's own repository, so this is its only workflow. It releases on
# `v*` tags. The `mon-` prefix these carried existed only to tell them apart
# from an application's tags in a shared repository.
name: Monitoring

on:
  push:
    tags: [ 'v*' ]
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  collector_test:
    name: Test collector
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erno
          POSTGRES_PASSWORD: erno
          POSTGRES_DB: erno
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: PGPASSWORD=erno createdb -h localhost -U erno erno_monitoring_test
      # `working-directory` rather than `-p`: api/.cargo/config.toml sets
      # RUST_TEST_THREADS=1, which cargo finds by walking up from the working
      # directory. The suite deadlocks against itself in parallel.
      - run: cargo test
        working-directory: api

  collector_docker:
    name: Build collector image
    runs-on: ubuntu-latest
    needs: collector_test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/monitoring:${{ steps.meta.outputs.version }}

  console_docker:
    name: Build console image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/monitoring-ui:${{ steps.meta.outputs.version }}
