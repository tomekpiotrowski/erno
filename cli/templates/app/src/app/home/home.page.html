<ion-header>
  <ion-toolbar>
    <ion-title>Home</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">Sign out</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <p>Signed in as <strong>{{ auth.currentUser()?.email }}</strong></p>

  <ion-button expand="block" color="danger" fill="outline" (click)="confirmDeleteAccount()">
    Delete account
  </ion-button>
</ion-content>
