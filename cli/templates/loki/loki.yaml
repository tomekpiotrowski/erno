# Written by `erno dev` under `.erno/loki/`. `__DATA__` is replaced with that
# directory. Query and OTLP/HTTP logs (`/otlp/v1/logs`) share :3100.
auth_enabled: false

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100
  log_level: error

common:
  instance_addr: 127.0.0.1
  path_prefix: __DATA__
  storage:
    filesystem:
      chunks_directory: __DATA__/chunks
      rules_directory: __DATA__/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  retention_period: 168h

compactor:
  working_directory: __DATA__/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem
