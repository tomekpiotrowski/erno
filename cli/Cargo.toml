[package]
name = "erno-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "CLI tool for the Erno framework"

[[bin]]
name = "erno"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
# Already in the tree via clap's `color` feature — listing them adds no crates.
anstyle = "1.0"
anstyle-query = "1.1"
serde = { workspace = true }
config_rs = { workspace = true }
dirs = "5"
tokio = { workspace = true, features = ["process", "io-util", "signal", "net"] }
tokio-postgres = "0.7"
rand = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true }
libc = "0.2"
argon2 = { workspace = true }
notify = "8.2.0"
