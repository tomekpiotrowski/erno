{{/*
  Prometheus for the monitoring deployment.

  Docs: docs/src/content/docs/monitoring/metrics.md

  This used to live in the application's own chart, which meant the thing doing
  the observing went down with the thing being observed. It belongs here, on the
  infrastructure that is meant to survive an application outage.

  It scrapes across the network now rather than in-cluster, so `api.url` is a
  full address and `api.metrics_auth_token` is required in practice — an
  internet-reachable /metrics should not be open.
*/}}
{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: erno-api
        metrics_path: /metrics
        {{- if .Values.api.scheme }}
        scheme: {{ .Values.api.scheme }}
        {{- end }}
        {{- if .Values.api.metrics_auth_token }}
        bearer_token: {{ .Values.api.metrics_auth_token | quote }}
        {{- end }}
        static_configs:
          - targets: [{{ .Values.api.target | quote }}]

      # The collector reports on itself: an operator needs to know when the
      # thing doing the watching is the thing that is struggling.
      - job_name: erno-monitoring
        metrics_path: /metrics
        {{- if .Values.collector.metrics_auth_token }}
        bearer_token: {{ .Values.collector.metrics_auth_token | quote }}
        {{- end }}
        static_configs:
          - targets: ["{{ .Release.Name }}-collector:{{ .Values.collector.port }}"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-prometheus
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.prometheus.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-prometheus
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-prometheus
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
            - --web.listen-address=:9090
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-prometheus
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-prometheus
spec:
  selector:
    app: {{ .Release.Name }}-prometheus
  ports:
    - port: 9090
      targetPort: 9090
{{- end }}
