[package]
name = "erno-monitoring"
version = "0.1.0"
edition.workspace = true
authors = ["Erno Contributors"]
description = "Erno monitoring collector — error reporting, deployed separately from the app it watches"
license = "MIT"
rust-version.workspace = true
publish = false

[[bin]]
name = "erno-monitoring"
path = "src/main.rs"

[features]
default = []
test-utils = ["erno/test-utils", "dep:axum-test"]

[dependencies]
erno = { path = "../api" }

async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

axum-test = { workspace = true, optional = true }

[dev-dependencies]
# The alert notifier takes a client; tests hand it a real one.
reqwest = { workspace = true }
# Enables the framework test harness (schema reset, per-test transaction,
# TestServer) for this crate's request tests.
erno = { path = "../api", features = ["test-utils"] }
axum-test = { workspace = true }
serde_json = { workspace = true }
