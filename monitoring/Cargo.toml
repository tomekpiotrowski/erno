[package]
name = "erno-monitoring"
version = "0.1.0"
edition.workspace = true
authors = ["Erno Contributors"]
description = "Erno monitoring collector — error reporting, deployed separately from the app it watches"
license = "MIT"
rust-version.workspace = true
publish = false

[[bin]]
name = "erno-monitoring"
path = "src/main.rs"

[features]
default = []
test-utils = ["erno/test-utils", "dep:axum-test"]

[dependencies]
erno = { path = "../api" }
erno-error-reporting-types = { workspace = true }

# The collector's own: ingest, grouping, alert delivery and the Prometheus
# query it runs for `promql` rules. These used to come in through the erno
# library; they are direct dependencies now that the collector lives here.
lettre = { version = "0.11.4", features = ["tokio1", "tokio1-native-tls", "builder", "smtp-transport", "serde"] }
metrics = "0.24"
regex = "1.11.1"
reqwest = { workspace = true }
thiserror = "2.0.12"
tower-http = { version = "0.6.6", features = ["cors"] }

async-trait = { workspace = true }
axum = { workspace = true }
bytes = "1"
chrono = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

axum-test = { workspace = true, optional = true }

[dev-dependencies]
# Config tests parse the same TOML shapes an operator writes.
toml = { workspace = true }
# Enables the framework test harness (schema reset, per-test transaction,
# TestServer) for this crate's request tests.
erno = { path = "../api", features = ["test-utils"] }
axum-test = { workspace = true }
serde_json = { workspace = true }
