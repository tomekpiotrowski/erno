# Erno monitoring collector — production.
#
# Everything secret comes from `erno deploy` as APP__* environment variables
# (see cli/src/deploy/render.rs). What stays
# here is what *cannot* come from the environment: `config_rs::Environment` is
# built with `.separator("__").try_parsing(true)` and no `list_separator`, so
# any list-valued key must live in this file.
#
# Deployed separately from the application, ideally on different infrastructure,
# so it survives the outages it exists to report.

# Overridden by APP__API_URL.
api_url = "https://monitoring.example.com"

[tracing]
log_level = "info"

[database]
# Overridden by DATABASE_URL.
url = ""
pool_size = 10

[server]
port = 3001

[email]
type = "smtp"

[auth]
# Unused by the collector — operators authenticate with HTTP Basic, and the
# collector deliberately does not depend on the application's auth service,
# which may be the thing that is down. Still validated at boot.
secret = "CHANGE_ME_run_erno_generate-jwt-secret"
access_token_minutes = 15
one_time_token_expiry_hours = 24
refresh_token_days = 30

[jobs.defaults]
job_timeout = 300
max_retries = 4
base_retry_delay_seconds = 60
retry_backoff_multiplier = 5

[jobs.cleanup]
interval_seconds = 3600
completed_retention_seconds = 7200
failed_retention_seconds = 172800
batch_size = 1000

# A list, so it cannot come from the environment. Every job type the framework
# registers must appear in some pool, or `verify_job_types_have_workers` panics
# the supervisor at boot and job processing dies silently while HTTP stays up.
[jobs.workers.default]
jobs = [
  "send_verification_email",
  "send_password_reset_email",
  "send_already_registered_email",
  "cancel_stripe_subscription",
  "delete_stripe_customer",
  "delete_user_files",
  "delete_record_attachments",
  "anonymize_collector_events",
]
count = 2

[rate_limiting]
enabled = true
default_window_secs = 60
default_max_requests = 1000
backoff_multiplier = 2.0

# A list — must be set here.
[metrics]
table_counts = ["error_issue", "error_event"]

# A list, and the one most likely to be wrong on first deploy. Browsers post
# error reports from the app and admin origins, which are different hosts from
# this one. A missing origin here silently kills browser reporting — nothing
# errors, reports simply stop arriving.
#
# Not needed for the console itself: it is served from the same origin as the
# collector, through the console's nginx.
[cors]
allowed_origins = [
  "https://app.example.com",
  "https://admin.example.com",
  "https://example.com",
]

# Operator credentials come from APP__ADMIN__USERNAME / __PASSWORD_HASH,
# generated by `erno deploy init --target monitoring`.

[collector]
enabled = true
# APP__COLLECTOR__SERVER_TOKEN / __BROWSER_TOKEN come from the chart.
server_token = ""
browser_token = ""

[collector.status]
enabled = true
name = "Example status"
output_path = "/app/status/status.json"
refresh_seconds = 30

# Set by the chart to the in-cluster Service; never through the ingress.
[collector.prometheus]
url = ""

[collector.alerts]
enabled = true
recipient = ""

# The monitoring deployment reports its own errors. Pointing this at itself
# means a total collector outage reports nothing — which is the honest tradeoff
# unless you run a second collector elsewhere.
[error_reporting]
enabled = true
collector_url = "http://localhost:3001"
ingest_token = ""
capture_tracing_errors = true
capture_panics = true
