# Erno monitoring collector — test.
#
# Deliberately a separate database from the application's: in production this
# whole deployment lives on separate infrastructure so it survives the outages
# it exists to report.
api_url = "http://localhost:3001"

[tracing]
log_level = "info"

[database]
url = "postgres://erno:erno@localhost/erno_monitoring_test"
pool_size = 5

[server]
port = 3001

[email]
type = "mock"

[auth]
# Unused by the collector — operators authenticate with HTTP Basic, and the
# collector deliberately does not depend on the application's auth service,
# which may be the thing that is down.
secret = "monitoring_jwt_secret_not_used_for_operator_auth_1234567890"
access_token_minutes = 15
one_time_token_expiry_hours = 24
refresh_token_days = 30

[jobs.defaults]
job_timeout = 300
max_retries = 4
base_retry_delay_seconds = 60
retry_backoff_multiplier = 5

[jobs.cleanup]
interval_seconds = 3600
completed_retention_seconds = 7200
failed_retention_seconds = 172800
batch_size = 1000

# Every job type registered by the framework must be listed in some pool, or
# `verify_job_types_have_workers` panics the supervisor at boot and job
# processing dies silently while the HTTP server stays up.
[jobs.workers.default]
jobs = [
  "send_verification_email",
  "send_password_reset_email",
  "send_already_registered_email",
  "cancel_stripe_subscription",
  "delete_stripe_customer",
  "delete_user_files",
  "delete_record_attachments",
  "anonymize_collector_events",
]
count = 1

[rate_limiting]
enabled = false
default_window_secs = 60
default_max_requests = 1000
backoff_multiplier = 2.0

[metrics]
table_counts = ["error_issue", "error_event"]

# Browsers post from the app and admin origins, which are different hosts.
[cors]
allowed_origins = ["http://localhost:4200", "http://localhost:4300", "http://localhost:4400"]

# Operator console — password: admin
[admin]
username = "admin"
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$5B2ECOLqakkxkiD5EjKyDQ$PBe29N0j5lou/OHFWQuxjKEnL7fv4GE9MhniBui9rYc"

[collector]
enabled = true
# Each test runs inside a single connection's transaction that is rolled back
# afterwards. A background writer on a second connection would both deadlock
# the single-connection pool and never see the test's data.
sync_writes = true
# Trusted server-to-server path. A real secret; belongs in SOPS in production.
server_token = "dev-server-token"
# PUBLIC — this ships inside the JS bundle. A speed bump against drive-by
# scanners, not a security control.
browser_token = "dev-browser-token"

[collector.alerts]
# Never mail from tests.
enabled = false
recipient = ""
