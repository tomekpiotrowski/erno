# Docs: monitoring/AGENTS.md
#
# The collector's test suite runs single-threaded on purpose.
#
# Every test shares one schema and is isolated by a per-test transaction that is
# rolled back afterwards. That works for tests that only touch their own rows —
# but several here operate table-wide by nature: the retention sweep deletes
# aged rows across the table, and the regression tests resolve every issue to
# check that a recurrence reopens it. Run in parallel, those block on rows other
# tests have inserted but not yet rolled back, and Postgres reports a deadlock.
#
# The suite takes roughly forty seconds serially, which is a fair price for tests
# that exercise the real sweeps rather than a scoped imitation of them.
#
# Cargo finds this file by walking up from the working directory, so it applies
# to `cd monitoring && cargo test` and NOT to `cargo test --workspace` from the
# repo root. `require_single_test_thread` in the suite itself covers that gap:
# it panics with an explanation rather than letting the deadlocks happen.
[env]
RUST_TEST_THREADS = "1"
