[package]
name = "erno"
version.workspace = true
edition.workspace = true
authors = ["Erno Contributors"]
description = "Shared infrastructure library for building REST APIs with Axum"
license = "MIT"
repository = "https://github.com/tomekpiotrowski/erno"
homepage = "https://github.com/tomekpiotrowski/erno"
readme = "README.md"
keywords = ["axum", "web", "api", "framework", "jobs"]
categories = ["web-programming", "asynchronous"]
rust-version.workspace = true

[features]
default = []
test-utils = ["dep:axum-test", "dep:lets_expect"]

[dependencies]
erno-error-reporting-types = { workspace = true }
axum = { workspace = true, features = ["ws", "multipart"] }
axum-macros = "0.5.0"
argon2 = { workspace = true }
sha2 = "0.10"
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
config_rs = { workspace = true }
cron = "0.12"
dashmap = "6.1"
fastrand = "2.1"
jsonwebtoken = "9.3"
lettre = { version = "0.11.4", features = ["tokio1", "tokio1-native-tls", "builder", "smtp-transport", "serde"] }
log = "0.4.27"
rand = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { version = "0.8", features = ["postgres"] }
strum = { version = "0.26.3", features = ["derive"] }
thiserror = "2.0.12"
tokio = { workspace = true, features = ["fs", "signal"] }
tower = "0.5"
tower-http = { version = "0.6.6", features = ["cors", "catch-panic"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "time", "local-time"] }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
uuid = { workspace = true }
regex = "1.11.1"
validator = { version = "0.20.0", features = ["derive"] }
time = { version = "0.3.41", features = ["formatting", "local-offset"] }
futures-util = "0.3"
async-stripe = { version = "0.40", features = ["runtime-tokio-hyper"] }
aws-sdk-s3 = "1"
aws-config = "1"
bytes = "1"
reqwest = { workspace = true }
axum-test = { workspace = true, optional = true }
lets_expect = { workspace = true, optional = true }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
opentelemetry-proto = { version = "0.31", default-features = false, features = ["gen-tonic-messages", "metrics", "with-serde"] }
prost = "0.14"


[dev-dependencies]
axum-test = { workspace = true }
toml = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
