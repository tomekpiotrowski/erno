api_url = "http://localhost:3000"

[tracing]
log_level = "info"

[database]
url = "postgres://erno:erno@localhost/erno"
pool_size = 5

[server]
port = 3000

[email]
type = "mock"

[auth]
secret = "test_jwt_secret_for_testing_only_1234567890"
access_token_minutes = 15
one_time_token_expiry_hours = 24
refresh_token_days = 30

[jobs.defaults]
job_timeout = 300
max_retries = 4
base_retry_delay_seconds = 60
retry_backoff_multiplier = 5

[jobs.cleanup]
interval_seconds = 3600
completed_retention_seconds = 7200
failed_retention_seconds = 172800
batch_size = 1000

# Explicit per-pool retry values are still honoured (they override defaults).
[jobs.workers.default]
jobs = []
count = 1
job_timeout = 300
max_retries = 4
base_retry_delay_seconds = 60
retry_backoff_multiplier = 5

[rate_limiting]
enabled = false
default_window_secs = 60
default_max_requests = 1000
backoff_multiplier = 2.0

# Operator admin API — password: admin
[admin]
username = "admin"
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$5B2ECOLqakkxkiD5EjKyDQ$PBe29N0j5lou/OHFWQuxjKEnL7fv4GE9MhniBui9rYc"

# Tests never reach out to a collector. Capture hooks are off too: a panic hook
# installed by one test leaks into the whole binary, and capturing every
# `tracing::error!` would pollute tests that deliberately provoke errors.
[error_reporting]
enabled = false
capture_tracing_errors = false
capture_panics = false
